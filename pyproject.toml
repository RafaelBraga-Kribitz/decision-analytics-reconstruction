[tool.poetry]
name = "decision-analytics-reconstruction"
version = "0.1.0"
description = "Retrospective Reconstruction of a National-Scale Marketing and Resource Allocation Decision System"
authors = ["Rafael Braga-Kribitz <rafaelbragakribitz@gmail.com>"]
readme = "README.md"
packages = [
    { include = "population_segmentation", from = "module_a_population_segmentation/src" },
    { include = "module_b_resource_allocation", from = "module_b_resource_allocation/src" },
    { include = "module_c_forecasting_scenarios", from = "module_c_forecasting_scenarios/src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = ">=2.0"
numpy = ">=1.26"
scipy = ">=1.11"
scikit-learn = ">=1.4"
pyarrow = ">=14.0"
chardet = ">=5.2"
rapidfuzz = ">=3.6"
pandera = ">=0.19"
pydantic = ">=2.6"
mlflow = ">=2.12"
pyyaml = ">=6.0"
python-dotenv = ">=1.0"
dvc = {version = ">=3.0", optional = true}
pulp = ">=2.8"
networkx = ">=3.2"
fastapi = ">=0.110"
uvicorn = ">=0.30"
pymc = ">=5.16,<6"
arviz = ">=0.19"
shap = {version = ">=0.44", optional = true}
streamlit = {version = ">=1.32", optional = true}
plotly = {version = ">=5.20", optional = true}

[tool.poetry.extras]
dashboard = ["streamlit", "plotly"]
explainability = ["shap"]
tracking = ["dvc"]
all = ["streamlit", "plotly", "shap", "dvc"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
black = ">=24.0"
ruff = ">=0.4"
pyright = ">=1.1.350"
graphifyy = ">=0.7,<0.8"
httpx = ">=0.27"
pre-commit = ">=4.0"
matplotlib = ">=3.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    ".eggs",
    "__pycache__",
    "build",
    "dist",
    "graphify-out",
    "htmlcov",
    "node_modules",
    "reports",
    "**/*.ipynb",
]
extend-exclude = [
    "module_a_population_segmentation/notebooks",
    "reports",
    "graphify-out",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"module_c_forecasting_scenarios/src/module_c_forecasting_scenarios/data/exceptions.py" = ["N818"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = [
    "module_a_population_segmentation/src",
    "module_b_resource_allocation/src",
]
exclude = [
    "module_a_population_segmentation/notebooks",
    "reports",
    "**/*.ipynb",
    "**/__pycache__",
]
# basedpyright: exclude alone does not suppress notebook diagnostics in the IDE;
# ignore suppresses analysis output for matched paths (see basedpyright issue #1134).
ignore = [
    "**/*.ipynb",
    "reports/**",
]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = [
    "module_a_population_segmentation/tests",
    "module_b_resource_allocation/tests",
    "module_c_forecasting_scenarios/tests",
    "tests",
]
addopts = "--tb=short -v --import-mode=importlib"
markers = [
    "slow: PyMC NUTS sampling; excluded from default make test (run test-module-c or pytest -m slow).",
]
