[tool.poetry]
name = "decision-analytics-reconstruction"
version = "0.1.0"
description = "Retrospective Reconstruction of a National-Scale Marketing and Resource Allocation Decision System"
authors = ["Rafael Braga-Kribitz <rafaelbragakribitz@gmail.com>"]
readme = "README.md"
packages = [
    { include = "population_segmentation", from = "module_a_population_segmentation/src" },
    { include = "module_b_resource_allocation", from = "module_b_resource_allocation/src" },
    { include = "module_c_forecasting_scenarios", from = "module_c_forecasting_scenarios/src" },
    { include = "contract_core", from = "shared/src" },
    { include = "visual_system", from = "shared/src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = ">=2.0"
numpy = ">=1.26"
scipy = ">=1.11"
scikit-learn = ">=1.4"
pyarrow = ">=14.0"
chardet = ">=5.2"
rapidfuzz = ">=3.6"
pandera = ">=0.19"
pydantic = ">=2.6"
mlflow = ">=2.12"
pyyaml = ">=6.0"
python-dotenv = ">=1.0"
dvc = {version = ">=3.0", optional = true}
pulp = ">=2.8"
networkx = ">=3.2"
fastapi = ">=0.110"
uvicorn = ">=0.30"
pymc = ">=5.16,<6"
arviz = ">=0.19,<1.0"
shap = {version = ">=0.44", optional = true}
streamlit = {version = ">=1.32", optional = true}
plotly = {version = ">=5.20", optional = true}
seaborn = "^0.13.2"
adjusttext = "^1.3.0"

[tool.poetry.extras]
dashboard = ["streamlit", "plotly"]
explainability = ["shap"]
tracking = ["dvc"]
all = ["streamlit", "plotly", "shap", "dvc"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
black = ">=24.0"
ruff = ">=0.4"
pyright = ">=1.1.350"
plotly = ">=5.20"
graphifyy = ">=0.7,<0.8"
httpx = ">=0.27"
pre-commit = ">=4.0"
matplotlib = ">=3.8"
ipykernel = "^7.2.0"
matplotlib-inline = "^0.2.2"
jupyter = "^1.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]
# Match Ruff: do not invoke notebook formatting without ``black[jupyter]`` (CI / minimal env).
extend-exclude = "\\.ipynb$|/graphify-out/|/module_a_population_segmentation/notebooks/|/reports/|/governance/_kit/"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    ".eggs",
    "__pycache__",
    "build",
    "dist",
    "graphify-out",
    "htmlcov",
    "node_modules",
    "reports",
    "**/*.ipynb",
]
extend-exclude = [
    "module_a_population_segmentation/notebooks",
    "reports",
    "graphify-out",
    "*.ipynb",
    "governance/_kit",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF100"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"module_c_forecasting_scenarios/src/module_c_forecasting_scenarios/data/exceptions.py" = ["N818"]
# AST walkers mirror ``test_architecture_public_google_docstrings_contract``; nested closures trip B023.
"tests/test_architecture_public_type_hints_contract.py" = ["B023", "SIM102", "SIM110"]
"scripts/verify_doc_registry.py" = ["E402"]
"scripts/build_docs_registry.py" = ["E402"]
"scripts/export_doc_registry_schema.py" = ["E402"]
"tests/test_doc_registry_schema.py" = ["E402"]
# EDA generators: black-formatted (#130); E501 deferred (narrative f-string blocks).
"reports/eda/generate_eda.py" = ["E501", "B905", "F841", "B007", "N806", "E402"]
"reports/eda/build_notebook.py" = ["E501", "UP032"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = [
    "module_a_population_segmentation/src",
    "module_b_resource_allocation/src",
    "module_c_forecasting_scenarios/src",
]
exclude = [
    "module_a_population_segmentation/notebooks",
    "reports",
    "**/*.ipynb",
    "**/__pycache__",
]
# basedpyright: exclude alone does not suppress notebook diagnostics in the IDE;
# ignore suppresses analysis output for matched paths (see basedpyright issue #1134).
ignore = [
    "**/*.ipynb",
    "reports/**",
]
reportMissingTypeStubs = false
reportMissingParameterType = false

# Modules B and C are being upgraded to strict mode in T8-2/T8-3.
# Until then, suppress the same pandas/sklearn/MLflow stub-limitation rules
# at the per-execution-environment level so the global strict baseline holds.
[[tool.pyright.executionEnvironments]]
root = "module_a_population_segmentation/src"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportMissingTypeArgument = false
reportMissingParameterType = false

[[tool.pyright.executionEnvironments]]
root = "module_b_resource_allocation/src"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportMissingTypeArgument = false
reportMissingParameterType = false

[[tool.pyright.executionEnvironments]]
root = "module_c_forecasting_scenarios/src"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportMissingTypeArgument = false
reportMissingParameterType = false

[tool.pytest.ini_options]
testpaths = [
    "module_a_population_segmentation/tests",
    "module_b_resource_allocation/tests",
    "module_c_forecasting_scenarios/tests",
    "tests",
]
addopts = "--tb=short -v --import-mode=importlib"
markers = [
    "slow: PyMC NUTS sampling; excluded from default make test (run test-module-c or pytest -m slow).",
]
