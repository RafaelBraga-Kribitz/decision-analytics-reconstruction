services:
  module_a:
    build:
      context: .
      dockerfile: module_a_population_segmentation/docker/Dockerfile
    image: decision-analytics-module-a:latest
    environment:
      - RANDOM_SEED=${RANDOM_SEED:-42}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-./mlflow/mlruns}
    volumes:
      - ./data:/app/data
      - ./mlflow:/app/mlflow
    ports:
      - "8501:8501"
    networks:
      - analytics_net

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: decision-analytics-mlflow:latest
    working_dir: /app
    volumes:
      - ./mlflow:/app/mlflow
    ports:
      - "5000:5000"
    networks:
      - analytics_net

networks:
  analytics_net:
    driver: bridge
