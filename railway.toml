# Railway.app service configuration — Module B Resource Allocation API
# Service: decision-analytics-module-b
# URL: https://decision-analytics-module-b-production.up.railway.app  (Railway-assigned hostname)
# Plan: Starter ($5 credit / month — sufficient for portfolio traffic)
# Docs: https://docs.railway.app/reference/config-as-code

[build]
# Nixpacks fails when NIXPACKS_POETRY_VERSION is unset (pip install poetry==).
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile.module-b"

[deploy]
# Do not set startCommand here: Docker deploys use exec form and $PORT would not
# expand (uvicorn error: '$PORT' is not a valid integer). Use docker/Dockerfile.module-b CMD.
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
