# Population generation configuration
# All values here are accessible via config/; none are hardcoded in src/

# ─── Scale ────────────────────────────────────────────────────────────────────
sample_size: 100000          # Dev default; full scale is N_full
N_full: 4260816              # TSJE, April 22, 2018

# ─── Outcome event date ───────────────────────────────────────────────────────
outcome_event_date: "2018-04-22"

# ─── Department weights (DGEEC 2018 electoral-roll shares) ───────────────────
# All 18 departments + Asunción; nominal shares at 4 decimal places sum to
# Decimal("1.0000"). Binary float loads can drift; generator.py reconciles to a
# probability vector whose float64 sum is exactly 1.0 for numpy RNG.
# Source: TSJE 2018 voter-roll proportions, normalised from DGEEC 2018
# projections.  Original raw values summed to 0.9200 due to rounding across
# 18 entries; corrected 2026-05-11 by proportional normalisation (÷ 0.92),
# rounding residual absorbed into Central (largest department).
department_weights:
  Asuncion: 0.0763
  Central: 0.3259
  Alto Parana: 0.1150
  Itapua: 0.0864
  Caaguazu: 0.0668
  San Pedro: 0.0490
  Cordillera: 0.0449
  Paraguari: 0.0385
  Misiones: 0.0242
  Guaira: 0.0238
  Amambay: 0.0221
  Canindeyu: 0.0213
  Caazapa: 0.0191
  Neembucu: 0.0130
  Concepcion: 0.0398
  Presidente Hayes: 0.0193
  Boqueron: 0.0088
  Alto Paraguay: 0.0058

# ─── Urban/rural mix per department (share urban; 1-x = rural) ───────────────
# Based on DGEEC 2018 projections; national average 61.7% urban
department_urban_share:
  Asuncion: 1.00
  Central: 0.98
  Alto Parana: 0.72
  Itapua: 0.52
  Caaguazu: 0.42
  San Pedro: 0.25
  Cordillera: 0.38
  Paraguari: 0.35
  Misiones: 0.56
  Guaira: 0.48
  Amambay: 0.73
  Canindeyu: 0.24
  Caazapa: 0.23
  Neembucu: 0.46
  Concepcion: 0.48
  Presidente Hayes: 0.37
  Boqueron: 0.31
  Alto Paraguay: 0.28

# ─── Age distribution ─────────────────────────────────────────────────────────
age_distribution:
  min_age: 18
  max_age: 99
  # Calibrated to TSJE 2018: youth (18-24) = 884927 / 4260816 = 20.77%
  # Bin boundaries and weights for inverse-CDF sampling
  bins: [18, 25, 35, 50, 65, 99]
  bin_weights: [0.208, 0.249, 0.282, 0.174, 0.087]  # sum = 1.0; youth bin 20.8%

# ─── Gender split ──────────────────────────────────────────────────────────────
gender_split:
  M: 0.504   # DGEEC 2018
  F: 0.496

# ─── Language priors ──────────────────────────────────────────────────────────
# National totals; conditional on rural_flag and department in cleaner
language_priors:
  jopara_bilingual: 0.46   # DGEEC bilingualism statistics
  guarani_only: 0.34
  spanish_only: 0.15
  other: 0.05

# ─── Cleaner synthetic imputation (raw columns missing entirely) ───────────────
# Used when clean_population must fabricate rural_flag / structural_dependency_proxy;
# language_census_bucket uses language_priors above. ``rural_flag_true_rate`` is also
# the generator's national rural rake target; preliminary urban fallback is ``1 - rate``.
cleaner_synthetic_defaults:
  # National P(rural) when rural_flag column is absent (aligns generator rake anchor).
  rural_flag_true_rate: 0.383
  structural_dependency_true_rate: 0.25

# ─── Generator synthetic rates (Bernoulli / categorical draws in generator.py) ─
generator_structural_dependency:
  rural_base_rate: 0.35
  urban_base_rate: 0.12
  elevated_rural_rate: 0.60
  elevated_departments:
    - San Pedro
    - Caazapa
    - Canindeyu
    - Concepcion
    - Paraguari

generator_ballot_blank_rates:
  president: 0.0241
  parlasur: 0.0848

generator_enc_source_raw_distribution:
  windows1252: 0.45
  utf8: 0.50
  unknown: 0.05

