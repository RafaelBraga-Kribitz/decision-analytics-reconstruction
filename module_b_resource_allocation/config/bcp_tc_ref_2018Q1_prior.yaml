  2018-W10: 5500.0   # Mar 05–11: strongest Guaraní — floor 5500 (≥ 5500 ✓)
  2018-W11: 5500.0   # Mar 12–18: floor holds (≥ 5500 ✓)
  2018-W12: 5505.0   # Mar 19–25: base building (≥ 5500 ✓)
