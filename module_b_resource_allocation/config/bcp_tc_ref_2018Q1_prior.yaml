_meta:
  description: |
    Jan–Apr 2018 weekly BCP reference TC_Ref PYG/USD prior series.
    Provenance: PRIOR — to be hardened against published BCP daily series.

    Temporal narrative embedded in anchor values:
      Jan–Feb: Guaraní-strengthening phase (harvest-dollar supply hits market).
                TC_Ref falls from ~5,615 toward ~5,500.
      March:   Guaraní strongest leg.  Each March week is ≥ 5,500 PYG/USD
                (spec floor TC_Ref,March ≥ 5,500).
      April:   Reversal — zafra cash absorbed, USD funding tightens.
                TC_Ref re-steepens to 5,600–5,700 (spec band [5,550, 5,750]).

    These weekly anchors are treated as constant within each ISO week when
    building the daily series (no within-week interpolation in prior mode).
  fx_anchor_year: 2018
  provenance: PRIOR
  march_floor_pyg_per_usd: 5500.0
  april_band_lo_pyg_per_usd: 5550.0
  april_band_hi_pyg_per_usd: 5750.0

weekly_reference_rate:
