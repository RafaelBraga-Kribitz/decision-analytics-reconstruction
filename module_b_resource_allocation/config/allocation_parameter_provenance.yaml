# config/allocation_parameter_provenance.yaml
# Provenance ledger for every hand-set objective coefficient in Module B's
# MILP (IMP-B01 / issue #57). Three of the six objective multipliers trace to
# the anchored persuasion stack in constants.py; the families below did not,
# and this file makes the absence of a measured source explicit rather than
# leaving invented multipliers undisclosed. provenance is one of
# constants.VALID_PROVENANCE (VERIFIED|PRIOR|ESTIMATED|NEUTRAL). Completeness
# and value-parity vs the code are enforced by
# scripts/check_allocation_parameter_provenance.py.
schema_version: 1
coefficient_families:
  tier_penalty:
    source_symbol: module_b_resource_allocation/models/allocation.py::_TIER_PENALTY
    values:
      stronghold:
        value: 1.0
        provenance: NEUTRAL
        source: "identity \u2014 no measured persuasion differential for this tier"
      swing:
        value: 1.1
        provenance: ESTIMATED
        source: 'assumption: swing departments weighted to 1.1x persuasion value;
          no calibration data (IMP-B01 discloses the gap)'
      opposition:
        value: 0.85
        provenance: ESTIMATED
        source: 'assumption: opposition departments weighted to 0.85x persuasion value;
          no calibration data (IMP-B01 discloses the gap)'
