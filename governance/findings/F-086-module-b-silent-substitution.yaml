id: F-086
title: "Silent FX-spread fallback and unlogged cleaning drops in the Module B data layer"
category: silent_fallback
kind: recurrence_invariant
status: closed
opened_at: 2026-10-11
closed_at: 2026-10-11
recurrence_count: 0
evidence: |
  module_b_resource_allocation/src/module_b_resource_allocation/fx/spread_model.py
  _spread_for_row fell back to DEFAULT_SPREAD_PYG_PER_USD (50.0) / tc_ref for
  any week missing from series_b_weekly with no log and no record of which
  weeks fell back.
  data/cleaner.py clean_budget_lines / clean_volunteer_logs /
  clean_media_buy_sheet discarded rows failing valid_mask (and de-duplicated
  on row_id) without counting or recording why.
  Measured consequence on the deterministic DirtyGenConfig batch:
  clean_directory returned 0 of 3,500 volunteer-log rows. read_csv inferred
  contacts_text as float and _parse_locale_number rejects non-strings, so the
  whole source was dropped silently.
verification_script: scripts/check_module_b_silent_substitution.py
notes: |
  Spec: governance/improvement_plan/IMP-B04_silent-substitution.md
  Closed 2026-10-11:
  - cleaner.py: _filter_and_record keeps a rejection row (source_file, row_id,
    reason = first failing check or duplicate_row_id, department, channel) for
    every dropped row; clean_directory_with_report returns frames, rejections
    and rejection_summary (per-source rate, gate at REJECTION_RATE_GATE = 2%);
    raw extracts are read with dtype=str, restoring 3,414/3,500 volunteer rows.
  - spread_model.py: fx_fallback_report (iso_week, tc_ref,
    fallback_pct_applied) + fx_fallback_gate (any fallback week = FAIL);
    apply_retail_spread logs a warning naming the weeks. Runtime values are
    unchanged.
  - scripts/generate_module_b_data_quality_report.py publishes
    reports/module_b/{data_rejection_report.csv, fx_fallback_report.csv,
    data_quality_summary.json}, byte-identical across runs. Demo batch:
    budget 163/2550, media 40/1200, volunteer 86/3500 rejected (FAIL by
    design: the generator injects 3% nulls + 2% duplicates); FX fallback 0
    weeks (PASS).
  Script: functional FX check (complete config passes, dropping 2018-W07 is
  reported and fails), regenerates the dirty batch and reconciles
  n_raw - n_clean == n_rejected per source, and checks the committed
  artifacts exist, reconcile, and are not stale.
