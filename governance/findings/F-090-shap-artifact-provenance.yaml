id: F-090
title: "Two scripts write reports/module_a/shap_summary.png; one plots a model fit on random data"
category: fake_completion
kind: recurrence_invariant
status: closed
opened_at: 2026-10-11
closed_at: 2026-10-11
recurrence_count: 0
evidence: |
  scripts/generate_module_a_shap.py fitted a throwaway LogisticRegression on
  rng.normal(size=(800, 6)) and wrote its SHAP summary to
  reports/module_a/shap_summary.png, the same path the canonical
  scripts/generate_module_a_report_charts.py writes from the fitted pipeline
  propensity model. Running the wrong script silently replaced published
  model evidence with a plot of noise.
  governance/FIGURE_MANIFEST.yaml named
  module_a_population_segmentation/pipeline/export.py (a path that does not
  exist; the module lives under src/) as the generator of both
  reports/module_a figures, because scripts/generate_figure_manifest.py mapped
  the whole directory to export.py.
verification_script: scripts/check_shap_artifact_provenance.py
notes: |
  Spec: governance/improvement_plan/IMP-V03_shap-provenance.md
  Closed 2026-10-11: deleted scripts/generate_module_a_shap.py; the manifest
  generator maps reports/module_a to scripts/generate_module_a_report_charts.py
  and the two manifest entries name it (same lines the generator emits). The
  committed shap_summary.png shows the real propensity features (metro_flag,
  youth_flag, rural_flag, ...), i.e. it already came from the canonical
  generator; no regeneration needed.
  Script: fails if the orphan exists, if any non-test Python file other than
  the canonical generator references shap_summary.png, or if the manifest
  entry is missing or names another generator.
