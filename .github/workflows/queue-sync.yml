name: Sync GitHub Issues to Agent Queue

# Smoke-checks that the agent queue can be generated from live issue state.
# The queue file itself is generated state and is NOT committed (issue #94:
# the committed copy went stale and listed closed issues as ready work).
# Agents regenerate it locally: poetry run python scripts/generate_agent_queue.py

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  pull_request:
    types: [opened, closed, labeled]
  push:
    branches: [main, claude/**]

jobs:
  sync-queue:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate agent_queue.json from GitHub Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/generate_agent_queue.py

      - name: Verify queue file generated
        run: |
          if [ -f .claude/agent_queue.json ]; then
            echo "Queue file generated successfully"
            jq '.ready_tasks | length' .claude/agent_queue.json
          else
            echo "ERROR: Queue file not generated"
            exit 1
          fi
