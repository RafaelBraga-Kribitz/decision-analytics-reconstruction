name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repo-make-test:
    name: Repo — make test (pytest + coverage, not slow)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: make test
        env:
          MC_FAST: "1"
        run: make test

      - name: Documentation registry verify (rebuild + conformance)
        run: make doc-registry-verify

      - name: Documentation registry checksum (committed artifact)
        run: shasum -a 256 docs/registry/docs_registry.yaml

  module-a:
    name: Module A — lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Doc markdown path sanity (repo-root .py references)
        run: poetry run python scripts/verify_doc_code_paths.py

      - name: Config integrity (department_weights sum)
        run: |
          poetry run python - <<'PY'
          from decimal import ROUND_HALF_EVEN, Decimal
          import yaml
          from pathlib import Path
          p = Path("module_a_population_segmentation/config/generation.yaml")
          cfg = yaml.safe_load(p.read_text(encoding="utf-8"))
          quant = Decimal("0.0001")
          decimal_sum = sum(
              Decimal(str(float(v))).quantize(quant, rounding=ROUND_HALF_EVEN)
              for v in cfg["department_weights"].values()
          )
          assert decimal_sum == Decimal("1.0000"), (
              "department_weights must sum to 1.0000 at 4 decimal places, "
              f"got {decimal_sum}"
          )
          print(f"department_weights Decimal(4dp) sum OK: {decimal_sum}")
          PY

      - name: Black format check
        run: poetry run black --check module_a_population_segmentation/src module_a_population_segmentation/tests module_a_population_segmentation/app

      - name: Ruff lint
        run: poetry run ruff check module_a_population_segmentation/src module_a_population_segmentation/tests module_a_population_segmentation/app

      - name: Pyright type check
        run: poetry run pyright module_a_population_segmentation/src

      - name: pytest with coverage
        run: >
          poetry run pytest module_a_population_segmentation/tests
          --cov=module_a_population_segmentation/src
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=80
          -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage.xml
          flags: module_a

  module-b:
    name: Module B — lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Black format check
        run: poetry run black --check module_b_resource_allocation/src module_b_resource_allocation/tests

      - name: Ruff lint
        run: poetry run ruff check module_b_resource_allocation/src module_b_resource_allocation/tests

      - name: Pyright type check
        run: poetry run pyright module_b_resource_allocation/src

      - name: pytest Module B
        run: poetry run pytest module_b_resource_allocation/tests -v --tb=short -m "not slow" \
          --cov=module_b_resource_allocation --cov-fail-under=70

  module-c:
    name: Module C — lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Black format check
        run: poetry run black --check module_c_forecasting_scenarios/src module_c_forecasting_scenarios/tests

      - name: Ruff lint
        run: poetry run ruff check module_c_forecasting_scenarios/src module_c_forecasting_scenarios/tests

      - name: Pyright type check
        run: poetry run pyright module_c_forecasting_scenarios/src

      - name: pytest Module C (exclude slow NUTS)
        env:
          MC_FAST: "1"
        run: >
          poetry run pytest module_c_forecasting_scenarios/tests
          -m "not slow"
          -v
          --cov=module_c_forecasting_scenarios
          --cov-fail-under=70

  docker-smoke:
    name: Module A — Docker image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: docker compose config
      - name: Build Module A image
        run: docker compose build module_a
      - name: Build MLflow image
        run: docker compose build mlflow
      - name: Import smoke
        run: docker compose run --rm module_a python -c "import population_segmentation; print('ok')"
      - name: Up no-start
        run: docker compose up --build --no-start module_a

      - name: MLflow image import smoke
        run: docker compose run --rm mlflow python -c "import mlflow; print(mlflow.__version__)"

  repo-docker-smoke:
    name: Repo — Docker smoke (make test inside container)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image with dev deps
        run: docker build -f docker/Dockerfile --build-arg INSTALL_DEV=1 -t decision-analytics-ci:smoke .

      - name: Run make test inside container
        run: >
          docker run --rm
          -e MC_FAST=1
          decision-analytics-ci:smoke
          make test

  tier3-smoke:
    name: Tier 3 — DVC + terminology scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry
      - name: Install with DVC extra
        run: poetry install --extras tracking
      - name: DVC version
        run: poetry run dvc version
      - name: DVC pipeline dry-run (validates dvc.yaml syntax)
        run: poetry run dvc repro --dry
      - name: Terminology sample check
        run: poetry run python scripts/check_terminology.py
