name: Governance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Steward-equivalent: regenerate state, fail on validation errors.
  governance-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry
      - name: Install project deps
        run: poetry install --no-interaction
      - name: make audit
        run: make audit

  # Adversary: re-verify every closed finding's verification_script on a clean
  # checkout. A closed finding that regresses fails the PR.
  #
  # Several findings (F-050/051/052) assert invariants on Module A pipeline
  # artifacts that live under data/processed (gitignored, DVC-tracked). The
  # job regenerates them deterministically (seeded) before verifying, so the
  # closure is genuinely re-checked rather than skipped for missing files.
  adversary:
    runs-on: ubuntu-latest
    needs: governance-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry pyyaml
      - name: Install project deps
        run: poetry install --no-interaction
      - name: Regenerate Module A artifacts (for data-dependent findings)
        run: |
          poetry run python -m population_segmentation.pipeline \
            --sample-size 50000 --out-dir data/processed
          poetry run python scripts/generate_figure_manifest.py
      - name: Re-verify closed findings
        run: poetry run python scripts/check_closed_findings.py

  # Debt ratchet: re-scan technical debt and fail if any metric grew past the
  # committed baseline (governance/DEBT_BASELINE.json). This is the "remediate
  # before it grows" gate. Install whatever debt tools apply to the project's
  # languages; missing tools are skipped, not fatal. See governance/DEBT_TOOLS.md.
  tech-debt:
    runs-on: ubuntu-latest
    needs: governance-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry and governance deps
        run: pip install poetry pyyaml
      - name: Install project deps
        run: poetry install --no-interaction
      - name: Install Python debt tools
        run: pip install ruff vulture radon
      # Uncomment for TS/JS projects:
      # - uses: actions/setup-node@v4
      #   with: { node-version: "20" }
      # - run: npm install -g knip jscpd
      - name: Debt ratchet
        run: python scripts/check_debt_ratchet.py
