name: Auto-Close Issues on PR Merge

on:
  pull_request:
    types: [closed]

jobs:
  auto-close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Extract issue number from PR body
        id: extract
        env:
          # Passed via env, never interpolated into the script: a PR body
          # containing backticks or $() must not execute on the runner.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Look for "Fixes #123", "Closes #123", "Resolves #123", etc.
          if [[ $PR_BODY =~ [Ff][Ii][Xx][Ee][Ss][[:space:]]*#([0-9]+) ]] || \
             [[ $PR_BODY =~ [Cc][Ll][Oo][Ss][Ee][Ss][[:space:]]*#([0-9]+) ]] || \
             [[ $PR_BODY =~ [Rr][Ee][Ss][Oo][Ll][Vv][Ee][Ss][[:space:]]*#([0-9]+) ]]; then
            echo "issue_number=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "Found issue #${BASH_REMATCH[1]}"
          else
            echo "No issue reference found in PR body"
          fi

      - name: Close issue and add label
        if: steps.extract.outputs.issue_number
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ steps.extract.outputs.issue_number }};

            // Close the issue
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });

            // Remove status:claude-ready label if it exists
            try {
              github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'status:claude-ready'
              });
            } catch (e) {
              // Label may not exist, that's fine
            }

            // Add status:completed label
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['status:completed']
            });

            console.log(`Closed issue #${issueNumber}`);
