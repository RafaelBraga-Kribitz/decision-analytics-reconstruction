name: Auto-Close Issues on PR Merge

on:
  pull_request:
    types: [closed]

jobs:
  auto-close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Extract issue number from PR body
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            // Never pass PR body through shell: markdown backticks and $()
            // would execute if interpolated into bash (see issue #101).
            const body = context.payload.pull_request.body ?? '';
            const match = body.match(/\b(?:fixes|closes|resolves)\s*#(\d+)/i);
            if (match) {
              core.setOutput('issue_number', match[1]);
              console.log(`Found issue #${match[1]}`);
            } else {
              console.log('No issue reference found in PR body');
            }

      - name: Close issue and add label
        if: steps.extract.outputs.issue_number
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ steps.extract.outputs.issue_number }};

            // Close the issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });

            // Remove status:claude-ready label if it exists.
            // Must await: without it a 404 becomes an unhandled rejection and
            // fails the job even when the label was never on the issue (#124).
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'status:claude-ready'
              });
            } catch (e) {
              if (e.status !== 404) throw e;
              // Label may not exist, that's fine
            }

            // Add status:completed label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['status:completed']
            });

            console.log(`Closed issue #${issueNumber}`);
