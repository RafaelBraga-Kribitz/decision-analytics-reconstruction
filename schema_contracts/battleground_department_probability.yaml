schema_name: battleground_department_probability
schema_version: "1.3.0"
description: >
  Department-level posterior win probability for Candidate A preference proxy
  (synthetic reconstruction). Keys align with allocation_output department names.
  ESTIMAND DISCLOSURE (IMP-C05 / F-078 / F-080): the primary published table
  uses estimand=poll_implied — unanchored national posterior × TSJE-derived
  swing factors (swing factors remain outcome-derived from
  tsje_2018_department_results.csv). The retrodiction companion
  (estimand=retrodiction) adds a second outcome-data entry point: the national
  posterior is softly anchored to the verified outcome
  (config/calibration.yaml use_outcome_anchor). Neither estimand is an
  out-of-sample forecast. Model c_battleground_v0.5 (F-081): μ_dept = swing × m,
  σ_dept = √(σ_national² + σ_idio,j²). Per-dept σ_idio estimated from reference
  poll-vs-result residuals and 2013↔2018 election cross-section when
  data/reference/battleground/ is present (see manifest sigma_idio_provenance).

unique_key:
  - department
  - calibration_series
  - estimand

fields:
  department:
    type: string
    nullable: false
  calibration_series:
    type: string
    nullable: false
    allowed_values: [A, B]
  win_probability_a:
    type: float64
    nullable: false
    min: 0.0
    max: 1.0
  model_version:
    type: string
    nullable: false
  estimand:
    type: string
    nullable: false
    allowed_values: [poll_implied, retrodiction]
  hdi_low:
    type: float64
    nullable: false
    min: 0.0
    max: 1.0
  hdi_high:
    type: float64
    nullable: false
    min: 0.0
    max: 1.0
