schema_name: battleground_department_probability
schema_version: "1.1.0"
description: >
  Department-level posterior win probability for Candidate A preference proxy
  (synthetic reconstruction). Keys align with allocation_output department names.
  ESTIMAND DISCLOSURE (IMP-C05 / F-078): this table is a RETRODICTION, not an
  out-of-sample forecast — outcome data enters at two points: (1) the national
  posterior is softly anchored to the verified outcome
  (config/calibration.yaml use_outcome_anchor), and (2) the per-department
  swing factors are derived from the realized tsje_2018_department_results.csv.
  The unanchored companion table (estimand=unanchored_retrodiction) removes
  entry point (1) only; swing factors remain outcome-derived in both. The
  idiosyncratic dispersion floor (sigma_idio) is an ILLUSTRATIVE assumption,
  not estimated from data — no department-level historical polling exists in
  this reconstruction to estimate it (see the run manifest's
  sigma_idio_provenance and geo/heatmap.py).

unique_key:
  - department
  - calibration_series
  - estimand

fields:
  department:
    type: string
    nullable: false
  calibration_series:
    type: string
    nullable: false
    allowed_values: [A, B]
  win_probability_a:
    type: float64
    nullable: false
    min: 0.0
    max: 1.0
  model_version:
    type: string
    nullable: false
  estimand:
    type: string
    nullable: false
    allowed_values: [retrodiction, unanchored_retrodiction]
  hdi_low:
    type: float64
    nullable: false
    min: 0.0
    max: 1.0
  hdi_high:
    type: float64
    nullable: false
    min: 0.0
    max: 1.0
