schema_name: monte_carlo_draws
schema_version: "1.0.0"
description: >
  Stratified Monte Carlo draws over the three canonical scenario buckets.
  Each row is one draw (draw_id is unique); shock_scale is the engagement
  shock magnitude propagated to allocation outcomes. Stratification
  guarantees every canonical bucket is represented even when the tracking
  fixture is sparse.

unique_key:
  - draw_id

fields:
  draw_id:
    type: int64
    nullable: false
    description: Monotone draw index 0..n-1.
  poll_wave_id:
    type: string
    nullable: true
    description: >
      Source poll wave for the draw when sampled from tracking; null when the
      draw was synthesized for a bucket with no tracking rows.
  scenario_bucket:
    type: string
    nullable: false
    allowed_values: [baseline, extreme_tracker, compounded_herd]
  shock_scale:
    type: float64
    nullable: false
    description: Engagement shock magnitude (post-multiplier).
  alloc_mean_persuasion_contacts:
    type: float64
    nullable: false
    description: >
      Mean persuasion-adjusted contacts from the allocation_baseline
      handshake (0.0 when no allocation parquet supplied). Scenario-INVARIANT:
      the same scalar on every draw — do not plot this as a distribution.
  scenario_adjusted_persuasion_contacts:
    type: float64
    nullable: false
    description: >
      Per-draw EFFECTIVE persuasion contacts = alloc_mean_persuasion_contacts ×
      shock_scale. This is the propagation of the engagement shock to the
      allocation outcome; it varies by draw and by scenario bucket and is the
      honest quantity to plot (the raw alloc_mean is constant). Effective /
      scenario-adjusted, not raw allocated contacts.
  draw_source:
    type: string
    nullable: false
    allowed_values: [tracking_sample, synthetic_prior]
    description: Whether the draw was sampled from tracking or synthesized.
  draw_weight:
    type: float64
    nullable: false
    min: 0
    description: >
      Importance weight = empirical_prevalence(scenario_bucket) /
      design_share(scenario_bucket), constant within a bucket for a given run
      (IMP-C08 / audit C14). Equal-thirds sampling is a variance-reduction
      DESIGN, not a likelihood claim; any statistic pooled across buckets
      (mean, quantile) must be weighted by this column — an unweighted pool
      silently asserts a uniform scenario prior nobody chose. A weight of
      0.0 is legitimate and expected for a bucket with zero observed
      prevalence in the tracking data (draw_source=synthetic_prior in that
      case): it may still be drawn at the design floor for conditional
      (per-bucket) exploration, but contributes nothing to pooled statistics
      — hypothetical, not observed.
