schema_name: participation_propensity
schema_version: "1.0.0"
description: >
  Platt-calibrated participation propensity scores for all entities.
  Produced by: module_a/models/propensity.py (PropensityModel)
  Consumed by: Module B (allocation weight), Module C (strata weight for forecast calibration)

fields:
  entity_id:
    type: int64
    nullable: false
    unique: true
    description: Foreign key to population_master_clean.entity_id
  participation_propensity:
    type: float32
    nullable: false
    min: 0.0
    max: 1.0
    description: Platt-calibrated P(participates=1 | features), post-department-rake
  raw_logit_score:
    type: float32
    nullable: false
    description: Raw logistic regression score before Platt calibration
  department_rake_multiplier:
    type: float32
    nullable: false
    description: Department-level rake factor applied post-Platt

calibration_gates:
  # VERIFIED department gates (TSJE 2018) — enforced at export exit, ±0.5 pp
  presidente_hayes_mean:
    target: 0.3237
    tolerance_pp: 0.005
    status: ENFORCED
    filter: "department == 'Presidente Hayes'"
    source: "TSJE, 2018"
  alto_parana_mean:
    target: 0.3747
    tolerance_pp: 0.005
    status: ENFORCED
    filter: "department == 'Alto Parana'"
    source: "TSJE, 2018"
  central_mean:
    target: 0.4399
    tolerance_pp: 0.005
    status: ENFORCED
    filter: "department == 'Central'"
    source: "TSJE, 2018"
  guaira_mean:
    target: 0.5826
    tolerance_pp: 0.005
    status: ENFORCED
    filter: "department == 'Guaira'"
    source: "TSJE, 2018"

  # INFORMATIONAL gates — not enforced at exit; documented for downstream consumers
  # NOTE: The TSJE-stated national rate (0.6125), gender rates (female: 0.6946,
  # male: 0.6772), and the 4 verified department rates together imply a population-
  # weighted participation mean of ~0.52 in the synthetic data (because Central and
  # Alto Parana are among the most populous departments but have below-national rates).
  # The calibration YAML currently uses 0.6125 as a placeholder for all 14 non-
  # verified departments; once the full TSJE department table is ingested the
  # national mean will be reconcilable.  Until then, national/gender/youth gates
  # are informational only.
  national_mean:
    target: 0.6125
    tolerance_pp: 0.10
    status: INFORMATIONAL
    note: >
      Placeholder: 14 departments defaulted to national rate (0.6125).
      Actual post-rake mean depends on dept population distribution.
    source: "TSJE, 2018"
  youth_mean:
    target: 0.528
    tolerance_pp: 0.10
    status: INFORMATIONAL
    filter: "age_on_event_date between 18 and 24"
    note: "Youth concentrate in urban low-participation departments; approx only."
    source: "TSJE, 2018"
  female_mean:
    target: 0.6946
    tolerance_pp: 0.20
    status: INFORMATIONAL
    filter: "gender == 'F'"
    note: >
      TSJE gender rates (F: 0.6946, M: 0.6772) imply national mean ~0.686,
      inconsistent with verified national rate 0.6125.  Different denominator
      in source tables likely.  Gender calibration is approximate.
    source: "TSJE, 2018"
  male_mean:
    target: 0.6772
    tolerance_pp: 0.20
    status: INFORMATIONAL
    filter: "gender == 'M'"
    note: "See female_mean note — same source inconsistency applies."
    source: "TSJE, 2018"
