schema_name: participation_propensity
schema_version: "1.0.0"
description: >
  Platt-calibrated participation propensity scores for all entities.
  Produced by: module_a/models/propensity.py (PropensityModel)
  Consumed by: Module B (allocation weight), Module C (strata weight for forecast calibration)

fields:
  entity_id:
    type: int64
    nullable: false
    unique: true
    description: Foreign key to population_master_clean.entity_id
  participation_propensity:
    type: float32
    nullable: false
    min: 0.0
    max: 1.0
    description: Platt-calibrated P(participates=1 | features), post-department-rake
  raw_logit_score:
    type: float32
    nullable: false
    description: Raw logistic regression score before Platt calibration
  department_rake_multiplier:
    type: float32
    nullable: false
    description: Department-level rake factor applied post-Platt

calibration_gates:
  # VERIFIED department gates (TSJE 2018, T11-1 full table) — enforced at
  # export exit, ±0.5 pp. Targets MUST equal
  # module_a_population_segmentation/config/calibration_anchors.yaml
  # department_participation_rates (CI sync test:
  # module_a_population_segmentation/tests/test_anchor_schema_sync.py).
  presidente_hayes_mean:
    target: 0.5816
    tolerance_pp: 0.005
    status: ENFORCED
    filter: "department == 'Presidente Hayes'"
    source: "TSJE, 2018 (T11-1)"
  alto_parana_mean:
    target: 0.6291
    tolerance_pp: 0.005
    status: ENFORCED
    filter: "department == 'Alto Parana'"
    source: "TSJE, 2018 (T11-1)"
  central_mean:
    target: 0.6207
    tolerance_pp: 0.005
    status: ENFORCED
    filter: "department == 'Central'"
    source: "TSJE, 2018 (T11-1)"
  guaira_mean:
    target: 0.6061
    tolerance_pp: 0.005
    status: ENFORCED
    filter: "department == 'Guaira'"
    source: "TSJE, 2018 (T11-1)"

  # INFORMATIONAL gates — not enforced at exit; documented for downstream
  # consumers. All 18 departmental participation rates are now verified
  # (T11-1), so the post-rake national mean is reconcilable with the TSJE
  # national rate up to the synthetic population's department distribution.
  national_mean:
    target: 0.6125
    tolerance_pp: 0.10
    status: INFORMATIONAL
    note: >
      All 18 department rates verified (T11-1). Post-rake national mean
      depends on the synthetic population's department distribution; kept
      informational rather than enforced.
    source: "TSJE, 2018"
  youth_mean:
    target: 0.528
    tolerance_pp: 0.10
    status: INFORMATIONAL
    filter: "age_on_event_date between 18 and 24"
    note: "Youth concentrate in urban low-participation departments; approx only."
    source: "TSJE, 2018"
  female_mean:
    target: 0.6946
    tolerance_pp: 0.20
    status: INFORMATIONAL
    filter: "gender == 'F'"
    note: >
      TSJE gender rates (F: 0.6946, M: 0.6772) imply national mean ~0.686,
      inconsistent with verified national rate 0.6125.  Different denominator
      in source tables likely.  Gender calibration is approximate.
    source: "TSJE, 2018"
  male_mean:
    target: 0.6772
    tolerance_pp: 0.20
    status: INFORMATIONAL
    filter: "gender == 'M'"
    note: "See female_mean note — same source inconsistency applies."
    source: "TSJE, 2018"
