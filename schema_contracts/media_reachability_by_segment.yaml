schema_name: media_reachability_by_segment
schema_version: "1.1.0"
description: >
  National segment-level rollup of media reachability metrics.
  Grain is strictly one row per canonical segment_label (k=6).
  `dominant_department` is the modal department of the segment (a descriptive
  summary column), NOT a row key.  Module B consumers that require
  (department, channel) caps MUST use the companion artifact
  `media_reachability_by_segment_department.csv` and its contract
  `media_reachability_by_segment_department.yaml` — do not reinterpret the
  segment-only rollup as a per-department cap source.
  Produced by: module_a (aggregation step).
  Consumed by: Module B (segment-level reach diagnostic), Module C (segment priors).

fields:
  segment_label:
    type: string
    nullable: false
    unique: true
    allowed_values:
      - rural_committed
      - urban_high_volatility
      - youth_volatile
      - structurally_dependent_bloc
      - rural_low_propensity
      - committed_opposition
  segment_size:
    type: int64
    nullable: false
    min: 1
  segment_size_pct:
    type: float32
    nullable: false
    min: 0.01
    max: 1.0
  mean_participation_propensity:
    type: float32
    nullable: false
    min: 0.0
    max: 1.0
  pct_internet_access:
    type: float32
    nullable: false
    min: 0.0
    max: 1.0
  mean_tv_penetration:
    type: float32
    nullable: false
    min: 0.0
    max: 1.0
  mean_radio_penetration:
    type: float32
    nullable: false
    min: 0.0
    max: 1.0
  mean_whatsapp_penetration:
    type: float32
    nullable: false
    min: 0.0
    max: 1.0
  pct_rural:
    type: float32
    nullable: false
    min: 0.0
    max: 1.0
  pct_jopara:
    type: float32
    nullable: false
    min: 0.0
    max: 1.0
  pct_structural_dependency:
    type: float32
    nullable: false
    min: 0.0
    max: 1.0
  dominant_department:
    type: string
    nullable: false
  primary_reach_channel:
    type: string
    nullable: false
    allowed_values: [tv, radio, whatsapp, direct]
